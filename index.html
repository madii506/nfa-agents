<body>
<div id="intro" class="intro idle" aria-label="nfa">
  <canvas id="hall" aria-hidden="true"></canvas>
  <div id="marks" class="marks" aria-hidden="true"></div>
  <div class="ictl l"><button type="button" id="isnd">sound</button></div>
</div>

<div id="app" class="app" hidden>
  <header class="tbar">
    <div class="tl"><span class="logo" aria-label="nfa"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.9 6.5V3.6Q1.9 1.9 3.6 1.9H6.5M13.5 1.9h2.9Q18.1 1.9 18.1 3.6V6.5M1.9 13.5v2.9Q1.9 18.1 3.6 18.1H6.5M13.5 18.1h2.9Q18.1 18.1 18.1 16.4V13.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><rect x="6.6" y="7.2" width="2.2" height="5.2" rx="1.1" fill="currentColor"/><rect x="11.2" y="7.2" width="2.2" height="5.2" rx="1.1" fill="currentColor"/></svg><span>nfa<i>.</i></span></span><span class="sess" id="sess">agent@nfa:~</span><button type="button" id="snd" class="tbtn" aria-label="sound">♪ <span>off</span></button><button type="button" id="palBtn" class="tbtn ghost" aria-label="search everything">⌘K</button></div>
    <nav class="tabs" id="tabs" aria-label="sections">
      <button type="button" data-run="help"><b>1</b>shell</button>
      <button type="button" data-run="agent"><b>2</b>agent</button>
      <button type="button" data-run="top"><b>3</b>market</button>
      <button type="button" data-run="launch"><b>4</b>launch</button>
      <button type="button" data-run="coins"><b>5</b>coins</button>
      <button type="button" data-run="cat readme.md"><b>6</b>docs</button>
    </nav>
    <div class="tr"><span class="clock" id="clock">--:--:--</span><button type="button" id="wal" class="tbtn">connect</button></div>
  </header>
  <div class="ltape" id="ltape"><div class="lt-c" id="ltC"></div><div class="lt-l"><i class="dot"></i>pump.fun</div><div class="lt-p" id="ltP"></div></div>
  <main class="panes" id="panes">
    <section class="pane shell" id="shell" aria-label="shell">
      <div class="ptitle"><span>shell</span><em id="shellNote">tab completes · ↑ history</em><button type="button" class="pcta" data-run="launch">launch a coin <i>→</i></button></div>
      <div class="out" id="out" role="log" aria-live="polite"></div>
      <form class="inline" id="cmdForm" autocomplete="off"><label class="ps1" for="cmd" id="ps1">nfa ~ $</label><div class="field"><span class="typed" id="typed"></span><span class="cur" id="cur"></span><span class="after" id="after"></span><span class="ghost" id="ghost"></span></div><input id="cmd" name="cmd" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="command"></form>
      <div class="chips" id="chips"></div>
    </section>
    <aside class="side">
      <section class="pane agent" id="agentPane" aria-label="agent">
        <div class="ptitle"><span>agent</span><em id="agentState">idle</em></div>
        <div class="agentTop"><pre class="face" id="face" aria-hidden="true"></pre><div class="astat" id="astat"></div></div>
        <div class="alog" id="alog"></div>
      </section>
      <section class="pane market" id="mktPane" aria-label="market">
        <div class="ptitle mt"><nav class="mtabs" id="mtabs" aria-label="markets"><button type="button" data-m="nfts" class="on">nfts</button><button type="button" data-m="crypto">crypto</button><button type="button" data-m="pump">pump.fun<i></i></button></nav><em id="mktState">connecting</em></div>
        <div class="mkt" id="mkt"></div><div class="mkt" id="mktC" hidden></div><div class="mkt" id="mktP" hidden></div>
      </section>
    </aside>
  </main>
  <footer class="sbar"><span id="sLeft"><i class="dot"></i>agent idle</span><span id="sMid" class="mid"></span><span id="sRight"></span></footer>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>
